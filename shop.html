<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop — Voltix</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="shop">
    <div class="topbar">FREE SHIPPING ON ORDERS OVER $100 · 30-DAY RETURNS</div>
    <header class="header"><a class="logo" href="index.html"><b>V</b> VOLTIX</a>
        <nav><a href="index.html">Home</a><a class="active" href="shop.html">Shop</a><a
                href="index.html#categories">Categories</a><a href="index.html#about">About</a></nav>
        <div class="actions"><button data-open-search>⌕</button><a href="login.html">Account</a><a href="cart.html">Cart
                <span class="cart-count">0</span></a></div>
    </header>
    <main class="page">
        <div class="heading">
            <p class="eyebrow">THE COLLECTION</p>
            <h1>Everything you need.<br><em>Nothing you don't.</em></h1>
            <p>Smartphones, laptops, audio and accessories selected with intention.</p>
        </div>
        <div class="toolbar">
            <div class="filters"><button class="filter active" data-category="all">All</button><button class="filter"
                    data-category="smartphones">Smartphones</button><button class="filter"
                    data-category="laptops">Laptops</button><button class="filter"
                    data-category="audio">Audio</button><button class="filter"
                    data-category="accessories">Accessories</button></div><select id="sort">
                <option value="featured">Featured</option>
                <option value="low">Price: Low to high</option>
                <option value="high">Price: High to low</option>
                <option value="name">Name A–Z</option>
            </select>
        </div>
        <div class="grid" id="shop-products"></div>
    </main>
    <footer class="compact">
        <div class="footer-bottom"><span>© 2026 Voltix</span><span>Designed & developed by Irtiza Riaz</span><span><a
                    href="index.html">Home</a> · <a href="cart.html">Cart</a></span></div>
    </footer>
    <div id="toast"></div>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
